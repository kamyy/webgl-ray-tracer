name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
      - infra/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploys run one at a time. Two overlapping runs would let the older one delete the newer build's hashed assets in
    # its last step.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Require the SITE_BUCKET variable
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
        run: test -n "$SITE_BUCKET" || { echo "Set the SITE_BUCKET repository variable by running infra/bootstrap/bootstrap.sh." >&2; exit 1; }

      # The new hashed assets go up first and the old ones are pruned last, so a visitor who still has the previous
      # index.html can load its assets until the new index.html is in place.
      - name: Upload hashed assets as immutable
        run: aws s3 sync dist/assets s3://${{ vars.SITE_BUCKET }}/assets --cache-control 'public, max-age=31536000, immutable'

      - name: Upload fixed-name files so browsers revalidate them
        run: aws s3 sync dist/ s3://${{ vars.SITE_BUCKET }} --delete --exclude 'assets/*' --cache-control 'no-cache'

      - name: Remove hashed assets the new build no longer uses
        run: aws s3 sync dist/assets s3://${{ vars.SITE_BUCKET }}/assets --delete --cache-control 'public, max-age=31536000, immutable'
